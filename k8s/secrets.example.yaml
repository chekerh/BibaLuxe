# This is an example file - DO NOT commit actual secrets!
# Use kubectl to create secrets:
# kubectl create secret generic backend-secrets --from-literal=mongodb-uri='...' --from-literal=jwt-secret='...' -n bibaluxe

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: bibaluxe
type: Opaque
stringData:
  mongodb-uri: "mongodb://mongodb-service:27017/bibaluxe"
  jwt-secret: "CHANGE_THIS_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: bibaluxe
type: Opaque
stringData:
  root-username: "admin"
  root-password: "CHANGE_THIS_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: bibaluxe
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_THIS_IN_PRODUCTION"
