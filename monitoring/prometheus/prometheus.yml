global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bibaluxe-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - 'alert_rules.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'bibaluxe-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:3001']
        labels:
          service: 'backend'
          tier: 'api'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Frontend metrics (if you add metrics endpoint)
  - job_name: 'bibaluxe-frontend'
    static_configs:
      - targets: ['frontend:3000']
        labels:
          service: 'frontend'
          tier: 'web'
    scrape_interval: 15s

  # MongoDB Exporter (if installed)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          service: 'mongodb'
          tier: 'database'
    scrape_interval: 30s
