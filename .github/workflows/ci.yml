name: CI Pipeline

on:
  push:
    branches: [ BibaLuxe, main, develop ]
  pull_request:
    branches: [ BibaLuxe, main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          NODE_ENV: production
      
      - name: Verify build output
        run: |
          test -d dist || exit 1
          test -f dist/main.js || exit 1
          echo "✓ Build successful"
      
      - name: Security audit
        run: npm audit --audit-level=moderate || true
      
      - name: Check for vulnerabilities
        run: |
          if npm audit --audit-level=high 2>&1 | grep -q "found [1-9]"; then
            echo "⚠ High severity vulnerabilities found"
            npm audit --audit-level=high
            exit 1
          else
            echo "✓ No high severity vulnerabilities"
          fi

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Lint
        run: npm run lint || echo "⚠ Linting issues found (non-blocking)"
      
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
      
      - name: Verify build output
        run: |
          test -d .next || exit 1
          echo "✓ Build successful"
      
      - name: Security audit
        run: npm audit --audit-level=moderate || true
      
      - name: Check for vulnerabilities
        run: |
          if npm audit --audit-level=high 2>&1 | grep -q "found [1-9]"; then
            echo "⚠ High severity vulnerabilities found"
            npm audit --audit-level=high
            exit 1
          else
            echo "✓ No high severity vulnerabilities"
          fi
      
      - name: Check translation completeness
        run: |
          node -e "
            const fs = require('fs');
            const en = JSON.parse(fs.readFileSync('messages/en.json', 'utf8'));
            const ar = JSON.parse(fs.readFileSync('messages/ar.json', 'utf8'));
            const fr = JSON.parse(fs.readFileSync('messages/fr.json', 'utf8'));
            function getKeys(obj, prefix = '') {
              let keys = [];
              for (const key in obj) {
                const fullKey = prefix ? \`\${prefix}.\${key}\` : key;
                if (typeof obj[key] === 'object' && !Array.isArray(obj[key])) {
                  keys = keys.concat(getKeys(obj[key], fullKey));
                } else {
                  keys.push(fullKey);
                }
              }
              return keys;
            }
            const enKeys = getKeys(en).sort();
            const arKeys = getKeys(ar).sort();
            const frKeys = getKeys(fr).sort();
            const missingInAr = enKeys.filter(k => !arKeys.includes(k));
            const missingInFr = enKeys.filter(k => !frKeys.includes(k));
            if (missingInAr.length > 0 || missingInFr.length > 0) {
              console.error('❌ Missing translations detected!');
              if (missingInAr.length > 0) console.error('Missing in ar.json:', missingInAr);
              if (missingInFr.length > 0) console.error('Missing in fr.json:', missingInFr);
              process.exit(1);
            }
            console.log('✓ All translations are complete');
          "

  # Combined status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()
    
    steps:
      - name: Check CI results
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "❌ CI checks failed"
            echo "Backend: ${{ needs.backend-ci.result }}"
            echo "Frontend: ${{ needs.frontend-ci.result }}"
            exit 1
          else
            echo "✓ All CI checks passed"
          fi
