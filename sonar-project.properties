# SonarQube Project Configuration
sonar.projectKey=bibaluxe
sonar.projectName=BibaLuxe E-commerce Platform
sonar.projectVersion=1.0.0

# Source code
sonar.sources=backend/src,frontend/app,frontend/components,frontend/lib
sonar.tests=backend/src/**/*.spec.ts,backend/src/**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/*.d.ts,**/coverage/**

# TypeScript/JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=ts,js

# Encoding
sonar.sourceEncoding=UTF-8

# Backend specific
sonar.modules=backend,frontend

backend.sonar.projectName=Backend
backend.sonar.sources=src
backend.sonar.tests=src
backend.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts

frontend.sonar.projectName=Frontend
frontend.sonar.sources=app,components,lib
frontend.sonar.tests=app,components,lib
frontend.sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/*.d.ts
